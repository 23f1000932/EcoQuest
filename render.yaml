services:
  - type: web
    name: ecoquest-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free          # Change to "starter" ($7/mo) for always-on
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false      # Set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure secret
      - key: CORS_ORIGINS
        sync: false           # Set to your Vercel URL
      - key: MAX_DAILY_UPLOADS
        value: "10"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "70"
      - key: ADMIN_EMAIL
        sync: false
